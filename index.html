<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const EDITOR_PASSWORD = '0753';

// ---------- icons (small dependency-free set) ----------
function Icon({ name, className }) {
  const common = { viewBox: '0 0 24 24', fill: 'none', stroke: 'currentColor', strokeWidth: 2, strokeLinecap: 'round', strokeLinejoin: 'round', className };
  switch (name) {
    case 'clipboard': return (<svg {...common}><rect x="6" y="4" width="12" height="16" rx="1"/><rect x="9" y="2.5" width="6" height="3" rx="1"/><path d="M9 10h6M9 13h6M9 16h4"/></svg>);
    case 'plus': return (<svg {...common}><path d="M12 5v14M5 12h14"/></svg>);
    case 'chevron-right': return (<svg {...common}><path d="M9 18l6-6-6-6"/></svg>);
    case 'chevron-left': return (<svg {...common}><path d="M15 18l-6-6 6-6"/></svg>);
    case 'lock': return (<svg {...common}><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>);
    case 'unlock': return (<svg {...common}><rect x="5" y="11" width="14" height="9" rx="1"/><path d="M8 11V7a4 4 0 0 1 7.5-2.3"/></svg>);
    case 'x': return (<svg {...common}><path d="M18 6 6 18M6 6l12 12"/></svg>);
    case 'trash': return (<svg {...common}><path d="M4 7h16M9 7V4h6v3M6 7l1 13a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-13"/></svg>);
    case 'pencil': return (<svg {...common}><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/></svg>);
    case 'check': return (<svg {...common}><path d="M5 13l4 4L19 7"/></svg>);
    case 'loader': return (<svg {...common}><circle cx="12" cy="12" r="9" strokeOpacity="0.25"/><path d="M21 12a9 9 0 0 0-9-9"/></svg>);
    case 'key': return (<svg {...common}><circle cx="7" cy="14" r="3"/><path d="M9.5 11.5 18 3m-4 4 2 2m-5-1 2 2"/></svg>);
    case 'alert': return (<svg {...common}><circle cx="12" cy="12" r="9"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>);
    case 'calendar': return (<svg {...common}><rect x="4" y="5" width="16" height="15" rx="1"/><path d="M4 9h16M8 3v4M16 3v4"/></svg>);
    default: return null;
  }
}

// ---------- helpers ----------
function genId(prefix) {
  return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`;
}
function formatDateLabel(dateStr) {
  if (!dateStr) return '';
  const d = new Date(dateStr + 'T00:00:00');
  if (isNaN(d.getTime())) return dateStr;
  return d.toLocaleDateString('sl-SI', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}
function effectiveLocked(date) {
  if (date.lockOverride === true) return true;
  if (date.lockOverride === false) return false;
  return (date.signups || []).length >= date.maxCapacity;
}
// NOVO: ali je tabla javna. Nove table se ustvarijo kot zasebne (isPublic: false).
// Table, ustvarjene pred to funkcijo, nimajo polja isPublic in štejejo kot javne,
// da ne izginejo nenadoma.
function isBoardPublic(board) {
  return board.isPublic !== false;
}
// Firebase doesn't store empty lists at all, so a board with no dates yet,
// or a date with no sign-ups yet, comes back with that field simply missing.
// This turns any missing/odd-shaped list back into a plain empty array so
// the rest of the app can always safely assume dates/signups are arrays.
function toArray(v) {
  if (Array.isArray(v)) return v;
  if (v && typeof v === 'object') return Object.values(v);
  return [];
}
function normalizeDoc(d) {
  const rawBoards = d && d.boards && typeof d.boards === 'object' ? d.boards : {};
  const boards = {};
  Object.keys(rawBoards).forEach((id) => {
    const b = rawBoards[id] || {};
    const dates = toArray(b.dates).map((date) => ({ ...date, signups: toArray(date.signups) }));
    boards[id] = { ...b, dates };
  });
  return { boards };
}

// runs `mutator` against the live server value; retries automatically on
// conflicting concurrent writes; mutator can throw to cleanly cancel
async function withTransaction(mutator) {
  let abortReason = null;
  const result = await dbRef.transaction((current) => {
    const fresh = normalizeDoc(current);
    try {
      return mutator(fresh);
    } catch (e) {
      abortReason = e.message;
      return undefined; // aborts the transaction, no changes written
    }
  });
  if (!result.committed) throw new Error(abortReason || 'Sprememb ni bilo mogoče shraniti. Poskusite znova.');
  return normalizeDoc(result.snapshot.val());
}

// ---------- presentational bits ----------
function CapacityMeter({ filled, total }) {
  return (
    <div className="flex items-center gap-2">
      {total <= 12 && (
        <div className="flex items-center gap-1">
          {Array.from({ length: total }).map((_, i) => (
            <span key={i} className={`w-2.5 h-2.5 rounded-full ${i < filled ? 'bg-amber-500' : 'border border-slate-300'}`} />
          ))}
        </div>
      )}
      <span className="text-xs font-medium text-slate-500">{filled}/{total}</span>
    </div>
  );
}
function FullBadge() {
  return (
    <span className="inline-flex items-center gap-1 text-red-700 font-display font-semibold text-xs">
      <Icon name="lock" className="w-3 h-3" />
      Zasedeno
    </span>
  );
}
function Spinner({ label }) {
  return (
    <div className="flex items-center gap-2 text-slate-500 py-10 justify-center">
      <Icon name="loader" className="w-4 h-4 animate-spin" />
      <span className="text-sm">{label}</span>
    </div>
  );
}

// ---------- app ----------
function App() {
  const [doc, setDoc] = useState(null);
  const [docLoading, setDocLoading] = useState(true);
  const [docError, setDocError] = useState('');

  const [view, setView] = useState('list');
  const [currentBoardId, setCurrentBoardId] = useState(null);
  const [boardError, setBoardError] = useState('');

  const [showCreate, setShowCreate] = useState(false);
  const [createName, setCreateName] = useState('');
  const [createDesc, setCreateDesc] = useState('');
  const [createErr, setCreateErr] = useState('');
  const [createBusy, setCreateBusy] = useState(false);

  const [unlockedBoards, setUnlockedBoards] = useState({});
  const [passwordGate, setPasswordGate] = useState(null); // null | 'create' | 'manage' | 'private'
  const [pwInput, setPwInput] = useState('');
  const [pwErr, setPwErr] = useState('');

  // NOVO: ali urednik na seznamu vidi tudi zasebne table
  const [showPrivate, setShowPrivate] = useState(false);
  const [publicBusy, setPublicBusy] = useState(false);

  const [showAddDate, setShowAddDate] = useState(false);
  const [newDate, setNewDate] = useState('');
  const [newNote, setNewNote] = useState('');
  const [newCap, setNewCap] = useState(5);
  const [addDateErr, setAddDateErr] = useState('');
  const [addDateBusy, setAddDateBusy] = useState(false);

  const [signupModalId, setSignupModalId] = useState(null);
  const [signupModalName, setSignupModalName] = useState('');
  const [signupModalErr, setSignupModalErr] = useState('');
  const [signupModalBusy, setSignupModalBusy] = useState(false);

  const [editingDateId, setEditingDateId] = useState(null);
  const [editDraft, setEditDraft] = useState({ date: '', note: '', maxCapacity: 1 });
  const [editErr, setEditErr] = useState('');

  const [confirmDeleteDate, setConfirmDeleteDate] = useState(null);
  const [confirmDeleteBoard, setConfirmDeleteBoard] = useState(false);
  const [rowBusy, setRowBusy] = useState({});

  // live connection — every device sees changes from every other device automatically
  useEffect(() => {
    const onValue = (snapshot) => {
      setDoc(normalizeDoc(snapshot.val()));
      setDocLoading(false);
      setDocError('');
    };
    const onErr = () => {
      setDocError('Podatkov ni bilo mogoče naložiti. Preverite internetno povezavo in pravila v Firebase konzoli (glejte navodila).');
      setDocLoading(false);
    };
    dbRef.on('value', onValue, onErr);
    return () => dbRef.off('value', onValue);
  }, []);

  function openBoard(id) {
    setCurrentBoardId(id);
    setView('board');
    setBoardError('');
  }
  function backToList() {
    setView('list');
    setCurrentBoardId(null);
    setPasswordGate(null);
    setPwInput('');
    setPwErr('');
    setShowAddDate(false);
    setEditingDateId(null);
    setConfirmDeleteBoard(false);
  }

  function openCreateGate() { setPasswordGate('create'); setPwInput(''); setPwErr(''); }
  function openManageGate() { setPasswordGate('manage'); setPwInput(''); setPwErr(''); }
  function openPrivateGate() { setPasswordGate('private'); setPwInput(''); setPwErr(''); }
  function closeGate() { setPasswordGate(null); setPwInput(''); setPwErr(''); }
  function submitPassword() {
    if (pwInput !== EDITOR_PASSWORD) { setPwErr('To geslo ni pravilno.'); return; }
    if (passwordGate === 'create') {
      closeGate(); setCreateErr(''); setShowCreate(true); setShowPrivate(true);
    } else if (passwordGate === 'manage' && currentBoardId) {
      setUnlockedBoards((prev) => ({ ...prev, [currentBoardId]: true }));
      closeGate();
    } else if (passwordGate === 'private') {
      setShowPrivate(true);
      closeGate();
    } else {
      closeGate();
    }
  }
  function lockBoard() {
    setUnlockedBoards((prev) => { const next = { ...prev }; delete next[currentBoardId]; return next; });
    setEditingDateId(null);
  }

  async function handleCreateBoard() {
    const name = createName.trim();
    if (!name) return setCreateErr('Vnesite ime table.');
    setCreateBusy(true);
    setCreateErr('');
    try {
      const id = genId('board');
      const description = createDesc.trim();
      await withTransaction((fresh) => ({
        // NOVO: nova tabla je zasebna, dokler je urednik ne objavi
        boards: { ...fresh.boards, [id]: { id, name, description, dates: [], createdAt: Date.now(), isPublic: false } },
      }));
      setShowCreate(false);
      setCreateName('');
      setCreateDesc('');
      setUnlockedBoards((p) => ({ ...p, [id]: true }));
      setCurrentBoardId(id);
      setView('board');
    } catch (e) {
      setCreateErr(e.message || 'Table ni bilo mogoče ustvariti. Poskusite znova.');
    } finally {
      setCreateBusy(false);
    }
  }

  // NOVO: preklop med Private in Public
  async function togglePublic() {
    setPublicBusy(true);
    setBoardError('');
    try {
      await withTransaction((fresh) => {
        const board = fresh.boards[currentBoardId];
        if (!board) throw new Error('Ta tabla ne obstaja več.');
        return { boards: { ...fresh.boards, [currentBoardId]: { ...board, isPublic: !isBoardPublic(board) } } };
      });
    } catch (e) {
      setBoardError(e.message || 'Tega ni bilo mogoče spremeniti. Poskusite znova.');
    } finally {
      setPublicBusy(false);
    }
  }

  async function handleAddDate() {
    if (!newDate) return setAddDateErr('Izberite datum.');
    const cap = Number(newCap);
    if (!Number.isFinite(cap) || cap < 1) return setAddDateErr('Kapaciteta mora biti vsaj 1.');
    setAddDateBusy(true);
    setAddDateErr('');
    try {
      const dateObj = { id: genId('date'), date: newDate, note: newNote.trim(), maxCapacity: Math.floor(cap), lockOverride: null, signups: [] };
      await withTransaction((fresh) => {
        const board = fresh.boards[currentBoardId];
        if (!board) throw new Error('Ta tabla ne obstaja več.');
        return { boards: { ...fresh.boards, [currentBoardId]: { ...board, dates: [...(board.dates || []), dateObj] } } };
      });
      setShowAddDate(false);
      setNewDate(''); setNewNote(''); setNewCap(5);
    } catch (e) {
      setAddDateErr(e.message || 'Datuma ni bilo mogoče dodati. Poskusite znova.');
    } finally {
      setAddDateBusy(false);
    }
  }

  function openSignupModal(dateId) { setSignupModalId(dateId); setSignupModalName(''); setSignupModalErr(''); }
  function closeSignupModal() { setSignupModalId(null); }
  async function confirmSignup() {
    const name = signupModalName.trim();
    if (!name) { setSignupModalErr('Vnesite svoje ime.'); return; }
    setSignupModalBusy(true);
    setSignupModalErr('');
    try {
      await withTransaction((fresh) => {
        const board = fresh.boards[currentBoardId];
        if (!board) throw new Error('Ta tabla ne obstaja več.');
        const d = (board.dates || []).find((x) => x.id === signupModalId);
        if (!d) throw new Error('Ta datum ne obstaja več.');
        if (effectiveLocked(d)) throw new Error('Ta datum je pravkar postal zaseden — izberite drugega.');
        const dates = board.dates.map((x) => x.id === d.id ? { ...x, signups: [...(x.signups || []), { id: genId('su'), name }] } : x);
        return { boards: { ...fresh.boards, [currentBoardId]: { ...board, dates } } };
      });
      setSignupModalId(null);
    } catch (e) {
      setSignupModalErr(e.message || 'Prijava ni uspela. Poskusite znova.');
    } finally {
      setSignupModalBusy(false);
    }
  }

  async function removeSignup(dateId, signupId) {
    setRowBusy((p) => ({ ...p, [dateId]: true }));
    setBoardError('');
    try {
      await withTransaction((fresh) => {
        const board = fresh.boards[currentBoardId];
        if (!board) throw new Error('Ta tabla ne obstaja več.');
        const dates = board.dates.map((d) => d.id === dateId ? { ...d, signups: d.signups.filter((s) => s.id !== signupId) } : d);
        return { boards: { ...fresh.boards, [currentBoardId]: { ...board, dates } } };
      });
    } catch (e) {
      setBoardError(e.message || 'Tega datuma ni bilo mogoče posodobiti. Poskusite znova.');
    } finally {
      setRowBusy((p) => ({ ...p, [dateId]: false }));
    }
  }
  async function toggleLock(dateId) {
    setRowBusy((p) => ({ ...p, [dateId]: true }));
    setBoardError('');
    try {
      await withTransaction((fresh) => {
        const board = fresh.boards[currentBoardId];
        if (!board) throw new Error('Ta tabla ne obstaja več.');
        const dates = board.dates.map((d) => {
          if (d.id !== dateId) return d;
          const locked = effectiveLocked(d);
          return { ...d, lockOverride: locked ? false : true };
        });
        return { boards: { ...fresh.boards, [currentBoardId]: { ...board, dates } } };
      });
    } catch (e) {
      setBoardError(e.message || 'Tega datuma ni bilo mogoče posodobiti. Poskusite znova.');
    } finally {
      setRowBusy((p) => ({ ...p, [dateId]: false }));
    }
  }
  async function resetOverride(dateId) {
    setRowBusy((p) => ({ ...p, [dateId]: true }));
    setBoardError('');
    try {
      await withTransaction((fresh) => {
        const board = fresh.boards[currentBoardId];
        if (!board) throw new Error('Ta tabla ne obstaja več.');
        const dates = board.dates.map((d) => d.id === dateId ? { ...d, lockOverride: null } : d);
        return { boards: { ...fresh.boards, [currentBoardId]: { ...board, dates } } };
      });
    } catch (e) {
      setBoardError(e.message || 'Tega datuma ni bilo mogoče posodobiti. Poskusite znova.');
    } finally {
      setRowBusy((p) => ({ ...p, [dateId]: false }));
    }
  }

  function startEdit(d) {
    setEditingDateId(d.id);
    setEditDraft({ date: d.date, note: d.note || '', maxCapacity: d.maxCapacity });
    setEditErr('');
  }
  async function saveEdit(dateId) {
    if (!editDraft.date) return setEditErr('Izberite datum.');
    const cap = Number(editDraft.maxCapacity);
    if (!Number.isFinite(cap) || cap < 1) return setEditErr('Kapaciteta mora biti vsaj 1.');
    try {
      await withTransaction((fresh) => {
        const board = fresh.boards[currentBoardId];
        if (!board) throw new Error('Ta tabla ne obstaja več.');
        const dates = board.dates.map((d) => d.id === dateId ? { ...d, date: editDraft.date, note: editDraft.note.trim(), maxCapacity: Math.floor(cap) } : d);
        return { boards: { ...fresh.boards, [currentBoardId]: { ...board, dates } } };
      });
      setEditingDateId(null);
    } catch (e) {
      setEditErr(e.message || 'Sprememb ni bilo mogoče shraniti. Poskusite znova.');
    }
  }

  async function deleteDate(dateId) {
    try {
      await withTransaction((fresh) => {
        const board = fresh.boards[currentBoardId];
        if (!board) throw new Error('Ta tabla ne obstaja več.');
        const dates = board.dates.filter((d) => d.id !== dateId);
        return { boards: { ...fresh.boards, [currentBoardId]: { ...board, dates } } };
      });
      setConfirmDeleteDate(null);
    } catch (e) {
      setBoardError(e.message || 'Datuma ni bilo mogoče izbrisati. Poskusite znova.');
    }
  }
  async function deleteBoard() {
    try {
      await withTransaction((fresh) => {
        const boards = { ...fresh.boards };
        delete boards[currentBoardId];
        return { boards };
      });
      backToList();
    } catch (e) {
      setBoardError(e.message || 'Table ni bilo mogoče izbrisati. Poskusite znova.');
    }
  }

  // NOVO: zasebne table so na seznamu vidne samo uredniku
  const boardList = doc
    ? Object.values(doc.boards)
        .filter((b) => isBoardPublic(b) || showPrivate || unlockedBoards[b.id])
        .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
    : [];
  const currentTable = doc && currentBoardId ? (doc.boards[currentBoardId] || null) : null;
  const isEditor = currentTable ? !!unlockedBoards[currentTable.id] : false;
  const currentIsPublic = currentTable ? isBoardPublic(currentTable) : true;
  const sortedDates = currentTable
    ? [...(currentTable.dates || [])].sort((a, b) => a.date === b.date ? (a.note || '').localeCompare(b.note || '') : a.date.localeCompare(b.date))
    : [];
  const signupModalDate = currentTable && signupModalId ? currentTable.dates.find((d) => d.id === signupModalId) : null;
  const signupModalLocked = signupModalDate ? effectiveLocked(signupModalDate) : false;

  return (
    <div className="min-h-screen bg-slate-50 text-slate-800">
      <div className="max-w-2xl mx-auto px-5 py-8 sm:py-12">
        <div className="flex items-center gap-2 mb-1">
          <Icon name="clipboard" className="w-5 h-5 text-slate-700" />
          <span className="font-display font-semibold text-lg tracking-tight text-slate-800">1.C Datumi Spraševanja</span>
        </div>
        <p className="text-xs text-slate-400 mb-7">Podatki se posodabljajo v živo za vse, ki imajo to stran odprto.</p>

        {docLoading && !doc ? (
          <Spinner label="Nalaganje …" />
        ) : docError && !doc ? (
          <div className="border border-red-200 bg-red-50 rounded-sm px-5 py-6 text-center">
            <Icon name="alert" className="w-5 h-5 text-red-700 mx-auto mb-2" />
            <p className="text-sm text-red-700">{docError}</p>
          </div>
        ) : (
          <div>
            {view === 'list' && (
              <div>
                <div className="flex items-start justify-between gap-4 mb-6">
                  <div>
                    <h1 className="font-display font-semibold text-2xl text-slate-900">Vaše table za prijave</h1>
                    <p className="text-sm text-slate-500 mt-1">Ustvarite datume, določite omejitev za vsak datum in omogočite prijave.</p>
                  </div>
                  <button onClick={openCreateGate}
                    className="shrink-0 inline-flex items-center gap-1.5 bg-slate-800 text-white text-sm font-medium px-3.5 py-2 rounded-sm hover:bg-slate-700 transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500">
                    <Icon name="plus" className="w-4 h-4" />
                    Nova tabla
                  </button>
                </div>

                {boardList.length === 0 && (
                  <div className="border border-dashed border-slate-300 rounded-sm px-5 py-10 text-center">
                    <p className="text-sm text-slate-500">Še ni tabel. Ustvarite eno, da začnete zbirati prijave.</p>
                  </div>
                )}

                {boardList.length > 0 && (
                  <div className="border-t border-slate-200">
                    {boardList.map((t) => (
                      <button key={t.id} onClick={() => openBoard(t.id)}
                        className="w-full flex items-center justify-between gap-4 py-4 border-b border-slate-200 text-left hover:bg-slate-100/60 transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 rounded-sm px-2 -mx-2">
                        <div className="min-w-0">
                          <div className="flex items-center gap-2 min-w-0">
                            <span className="font-medium text-slate-800 truncate">{t.name}</span>
                            {!isBoardPublic(t) && (
                              <span className="shrink-0 text-xs font-semibold text-red-700 bg-red-50 border border-red-200 rounded-sm px-1.5 py-0.5">Private</span>
                            )}
                          </div>
                          {t.description && <div className="text-sm text-slate-500 truncate mt-0.5">{t.description}</div>}
                        </div>
                        <Icon name="chevron-right" className="w-4 h-4 text-slate-400 shrink-0" />
                      </button>
                    ))}
                  </div>
                )}

                {/* NOVO: prijava urednika, da vidi zasebne table */}
                <div className="mt-8 text-center">
                  {showPrivate ? (
                    <button onClick={() => setShowPrivate(false)} className="text-xs text-slate-400 hover:text-slate-700 underline transition-colors">
                      Skrij zasebne table
                    </button>
                  ) : (
                    <button onClick={openPrivateGate} className="text-xs text-slate-400 hover:text-slate-700 underline transition-colors">
                      Prijava urednika (pokaži zasebne table)
                    </button>
                  )}
                </div>
              </div>
            )}

            {view === 'board' && (
              <div>
                <button onClick={backToList} className="inline-flex items-center gap-1 text-sm text-slate-500 hover:text-slate-800 transition-colors mb-6">
                  <Icon name="chevron-left" className="w-4 h-4" />Vse table
                </button>

                {!currentTable ? (
                  <div className="flex items-center gap-2 text-sm text-red-700 bg-red-50 border border-red-200 rounded-sm px-3 py-2">
                    <Icon name="alert" className="w-4 h-4 shrink-0" />
                    Te table ni bilo mogoče najti. Morda jo je izbrisal drug urednik.
                  </div>
                ) : (
                  <div>
                    <div className="flex items-start justify-between gap-4 mb-1">
                      <h1 className="font-display font-semibold text-2xl text-slate-900">{currentTable.name}</h1>
                      <div className="shrink-0 flex items-center gap-2">
                        {/* NOVO: gumb Private (rdeč) / Public (zelen), viden samo uredniku */}
                        {isEditor && (
                          <button onClick={togglePublic} disabled={publicBusy}
                            title={currentIsPublic ? 'Tabla je vidna vsem. Kliknite, da jo skrijete.' : 'Tabla je skrita. Kliknite, da jo objavite.'}
                            className={`inline-flex items-center gap-1.5 text-sm font-semibold text-white px-3 py-1.5 rounded-sm transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 disabled:opacity-60 ${currentIsPublic ? 'bg-green-600 hover:bg-green-700' : 'bg-red-600 hover:bg-red-700'}`}>
                            {publicBusy
                              ? <Icon name="loader" className="w-3.5 h-3.5 animate-spin" />
                              : <Icon name={currentIsPublic ? 'unlock' : 'lock'} className="w-3.5 h-3.5" />}
                            {currentIsPublic ? 'Public' : 'Private'}
                          </button>
                        )}
                        <button onClick={() => (isEditor ? lockBoard() : openManageGate())}
                          title={isEditor ? 'Izhod iz urejevalnega načina' : 'Dostop urednika'}
                          className={`inline-flex items-center justify-center w-9 h-9 rounded-full border transition-colors focus:outline-none focus:ring-2 focus:ring-amber-500 ${isEditor ? 'bg-amber-500 border-amber-500 text-white' : 'border-slate-300 text-slate-500 hover:bg-slate-100'}`}>
                          <Icon name={isEditor ? 'unlock' : 'lock'} className="w-4 h-4" />
                        </button>
                      </div>
                    </div>
                    {currentTable.description && <p className="text-sm text-slate-500 mt-1">{currentTable.description}</p>}

                    {isEditor && !currentIsPublic && (
                      <p className="text-xs text-red-700 mt-3">Tabla je zasebna: drugi je ne vidijo. Ko bo pripravljena, kliknite gumb Private, da postane Public.</p>
                    )}

                    {boardError && (
                      <div className="flex items-center gap-2 text-sm text-red-700 bg-red-50 border border-red-200 rounded-sm px-3 py-2 mt-4">
                        <Icon name="alert" className="w-4 h-4 shrink-0" />
                        {boardError}
                      </div>
                    )}

                    {!currentIsPublic && !isEditor ? (
                      <div className="mt-8 border border-dashed border-slate-300 rounded-sm px-5 py-10 text-center">
                        <Icon name="lock" className="w-5 h-5 text-slate-400 mx-auto mb-2" />
                        <p className="text-sm text-slate-500">Ta tabla še ni objavljena.</p>
                      </div>
                    ) : (
                    <React.Fragment>
                    <div className="mt-8">
                      <h2 className="font-display font-semibold text-sm text-slate-500 mb-1">Datumi</h2>
                      <p className="text-xs text-slate-400 mb-3">Kliknite na razpoložljiv datum, da se prijavite.</p>

                      {sortedDates.length === 0 && (
                        <div className="border border-dashed border-slate-300 rounded-sm px-5 py-8 text-center">
                          <Icon name="calendar" className="w-5 h-5 text-slate-400 mx-auto mb-2" />
                          <p className="text-sm text-slate-500">{isEditor ? 'Še ni datumov. Dodajte prvega spodaj.' : 'Na to tablo še ni bil dodan noben datum.'}</p>
                        </div>
                      )}

                      <div className="space-y-3">
                        {sortedDates.map((d) => {
                          const locked = effectiveLocked(d);
                          const isEditing = editingDateId === d.id;
                          return (
                            <div key={d.id}>
                              {isEditing ? (
                                <div className="bg-white border border-slate-300 rounded-sm p-4">
                                  <div className="grid grid-cols-2 gap-3 mb-3">
                                    <label className="text-xs text-slate-500">Datum
                                      <input type="date" value={editDraft.date} onChange={(e) => setEditDraft((p) => ({ ...p, date: e.target.value }))}
                                        className="mt-1 w-full border border-slate-300 rounded-sm px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
                                    </label>
                                    <label className="text-xs text-slate-500">Kapaciteta
                                      <input type="number" min="1" value={editDraft.maxCapacity} onChange={(e) => setEditDraft((p) => ({ ...p, maxCapacity: e.target.value }))}
                                        className="mt-1 w-full border border-slate-300 rounded-sm px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
                                    </label>
                                  </div>
                                  <label className="text-xs text-slate-500 block mb-3">Opomba (neobvezno)
                                    <input type="text" value={editDraft.note} onChange={(e) => setEditDraft((p) => ({ ...p, note: e.target.value }))} placeholder="npr. Dopoldanski termin"
                                      className="mt-1 w-full border border-slate-300 rounded-sm px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
                                  </label>
                                  {editErr && <p className="text-xs text-red-700 mb-2">{editErr}</p>}
                                  <div className="flex gap-2">
                                    <button onClick={() => saveEdit(d.id)} className="inline-flex items-center gap-1 bg-slate-800 text-white text-sm font-medium px-3 py-1.5 rounded-sm hover:bg-slate-700 transition-colors">
                                      <Icon name="check" className="w-3.5 h-3.5" />Shrani
                                    </button>
                                    <button onClick={() => { setEditingDateId(null); setEditErr(''); }} className="text-sm text-slate-500 px-3 py-1.5 hover:text-slate-800 transition-colors">Prekliči</button>
                                  </div>
                                </div>
                              ) : (
                                <div
                                  onClick={() => openSignupModal(d.id)}
                                  className={`border rounded-sm px-4 py-3 transition-colors cursor-pointer ${locked ? 'border-red-300 bg-red-50' : 'border-slate-200 bg-white hover:bg-slate-50'}`}
                                >
                                  <div className="flex items-center justify-between gap-3 flex-wrap">
                                    <div>
                                      <div className="font-medium text-slate-800">{formatDateLabel(d.date)}</div>
                                      {d.note && <div className="text-xs text-slate-500">{d.note}</div>}
                                    </div>
                                    <div className="flex items-center gap-3">
                                      <CapacityMeter filled={(d.signups || []).length} total={d.maxCapacity} />
                                      {locked && <FullBadge />}
                                    </div>
                                  </div>

                                  {(d.signups || []).length > 0 && (
                                    <ul className="mt-2 flex flex-wrap gap-x-3 gap-y-1">
                                      {d.signups.map((s) => (
                                        <li key={s.id} className="text-xs text-slate-500 inline-flex items-center gap-1">
                                          {s.name}
                                          {isEditor && (
                                            <button onClick={(e) => { e.stopPropagation(); removeSignup(d.id, s.id); }} disabled={rowBusy[d.id]} title="Odstrani" className="text-slate-400 hover:text-red-700 transition-colors">
                                              <Icon name="x" className="w-3 h-3" />
                                            </button>
                                          )}
                                        </li>
                                      ))}
                                    </ul>
                                  )}

                                  {!locked && <p className="text-xs text-slate-400 mt-2">Kliknite za prijavo</p>}

                                  {isEditor && (
                                    <div className="mt-3 flex flex-wrap items-center gap-3" onClick={(e) => e.stopPropagation()}>
                                      <button onClick={() => toggleLock(d.id)} disabled={rowBusy[d.id]}
                                        className="inline-flex items-center gap-1 text-xs font-medium border border-slate-300 text-slate-600 px-2.5 py-1 rounded-sm hover:bg-slate-100 transition-colors">
                                        <Icon name={locked ? 'unlock' : 'lock'} className="w-3 h-3" />
                                        {locked ? 'Odkleni ta datum' : 'Zakleni ta datum'}
                                      </button>
                                      {d.lockOverride !== null && d.lockOverride !== undefined && (
                                        <button onClick={() => resetOverride(d.id)} className="text-xs text-slate-400 hover:text-slate-700 transition-colors underline">Ponastavi na samodejno</button>
                                      )}
                                      <button onClick={() => startEdit(d)} className="inline-flex items-center gap-1 text-xs font-medium text-slate-500 hover:text-slate-800 transition-colors">
                                        <Icon name="pencil" className="w-3 h-3" />Uredi
                                      </button>
                                      {confirmDeleteDate === d.id ? (
                                        <span className="inline-flex items-center gap-2 text-xs">
                                          <span className="text-slate-500">Izbrisati ta datum?</span>
                                          <button onClick={() => deleteDate(d.id)} className="text-red-700 font-medium hover:underline">Da</button>
                                          <button onClick={() => setConfirmDeleteDate(null)} className="text-slate-500 hover:underline">Ne</button>
                                        </span>
                                      ) : (
                                        <button onClick={() => setConfirmDeleteDate(d.id)} className="inline-flex items-center gap-1 text-xs font-medium text-slate-400 hover:text-red-700 transition-colors">
                                          <Icon name="trash" className="w-3 h-3" />Izbriši
                                        </button>
                                      )}
                                    </div>
                                  )}
                                </div>
                              )}
                            </div>
                          );
                        })}
                      </div>

                      {isEditor && !showAddDate && (
                        <button onClick={() => { setShowAddDate(true); setAddDateErr(''); }}
                          className="mt-4 inline-flex items-center gap-1.5 text-sm font-medium text-slate-700 border border-slate-300 px-3 py-1.5 rounded-sm hover:bg-slate-100 transition-colors">
                          <Icon name="plus" className="w-4 h-4" />Dodaj datum
                        </button>
                      )}

                      {isEditor && showAddDate && (
                        <div className="mt-4 border border-slate-300 rounded-sm p-4 bg-white">
                          <div className="grid grid-cols-2 gap-3 mb-3">
                            <label className="text-xs text-slate-500">Datum
                              <input type="date" value={newDate} onChange={(e) => setNewDate(e.target.value)}
                                className="mt-1 w-full border border-slate-300 rounded-sm px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
                            </label>
                            <label className="text-xs text-slate-500">Kapaciteta
                              <input type="number" min="1" value={newCap} onChange={(e) => setNewCap(e.target.value)}
                                className="mt-1 w-full border border-slate-300 rounded-sm px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
                            </label>
                          </div>
                          <label className="text-xs text-slate-500 block mb-3">Opomba (neobvezno)
                            <input type="text" value={newNote} onChange={(e) => setNewNote(e.target.value)} placeholder="npr. Dopoldanski termin"
                              className="mt-1 w-full border border-slate-300 rounded-sm px-2 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
                          </label>
                          {addDateErr && <p className="text-xs text-red-700 mb-2">{addDateErr}</p>}
                          <div className="flex gap-2">
                            <button onClick={handleAddDate} disabled={addDateBusy}
                              className="inline-flex items-center gap-1 bg-slate-800 text-white text-sm font-medium px-3 py-1.5 rounded-sm hover:bg-slate-700 transition-colors disabled:opacity-60">
                              {addDateBusy ? <Icon name="loader" className="w-3.5 h-3.5 animate-spin" /> : 'Dodaj datum'}
                            </button>
                            <button onClick={() => setShowAddDate(false)} className="text-sm text-slate-500 px-3 py-1.5 hover:text-slate-800 transition-colors">Prekliči</button>
                          </div>
                        </div>
                      )}
                    </div>

                    {isEditor && (
                      <div className="mt-10 pt-6 border-t border-slate-200">
                        {confirmDeleteBoard ? (
                          <div className="text-sm">
                            <span className="text-slate-600">Izbrisati celotno tablo, vključno z vsemi datumi in prijavami?</span>{' '}
                            <button onClick={deleteBoard} className="text-red-700 font-medium hover:underline">Da, izbriši</button>{' '}
                            <button onClick={() => setConfirmDeleteBoard(false)} className="text-slate-500 hover:underline">Prekliči</button>
                          </div>
                        ) : (
                          <button onClick={() => setConfirmDeleteBoard(true)} className="inline-flex items-center gap-1.5 text-sm text-slate-400 hover:text-red-700 transition-colors">
                            <Icon name="trash" className="w-3.5 h-3.5" />Izbriši to tablo
                          </button>
                        )}
                      </div>
                    )}
                    </React.Fragment>
                    )}
                  </div>
                )}
              </div>
            )}
          </div>
        )}
      </div>

      {/* password gate modal — used for "create board", "manage board" and "show private boards" */}
      {passwordGate && (
        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white border border-slate-300 rounded-sm p-5 w-full max-w-sm">
            <div className="flex items-center gap-2 mb-3">
              <Icon name="key" className="w-4 h-4 text-slate-500" />
              <h3 className="font-display font-semibold text-base text-slate-900">
                {passwordGate === 'create' ? 'Geslo za ustvarjanje table' : 'Geslo urednika'}
              </h3>
            </div>
            <input type="password" value={pwInput} onChange={(e) => setPwInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && submitPassword()}
              className="w-full border border-slate-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
              placeholder="Geslo" autoFocus />
            {pwErr && <p className="text-xs text-red-700 mt-2">{pwErr}</p>}
            <div className="flex gap-2 mt-3">
              <button onClick={submitPassword} className="bg-slate-800 text-white text-sm font-medium px-3.5 py-1.5 rounded-sm hover:bg-slate-700 transition-colors">Potrdi</button>
              <button onClick={closeGate} className="text-sm text-slate-500 px-3 py-1.5 hover:text-slate-800 transition-colors">Prekliči</button>
            </div>
          </div>
        </div>
      )}

      {/* create board modal */}
      {showCreate && (
        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white border border-slate-300 rounded-sm p-5 w-full max-w-sm">
            <h3 className="font-display font-semibold text-lg text-slate-900 mb-4">Nova tabla</h3>
            <label className="text-xs text-slate-500 block mb-3">Ime
              <input type="text" value={createName} onChange={(e) => setCreateName(e.target.value)} placeholder="npr. Prostovoljske izmene"
                className="mt-1 w-full border border-slate-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" autoFocus />
            </label>
            <label className="text-xs text-slate-500 block mb-1">Opis (neobvezno)
              <input type="text" value={createDesc} onChange={(e) => setCreateDesc(e.target.value)} placeholder="Za kaj je to?"
                className="mt-1 w-full border border-slate-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500" />
            </label>
            <p className="text-xs text-slate-400 mt-2">Nova tabla bo zasebna, dokler je ne objavite.</p>
            {createErr && <p className="text-xs text-red-700 mt-2 mb-2">{createErr}</p>}
            <div className="flex gap-2 mt-3">
              <button onClick={handleCreateBoard} disabled={createBusy}
                className="inline-flex items-center gap-1 bg-slate-800 text-white text-sm font-medium px-3.5 py-1.5 rounded-sm hover:bg-slate-700 transition-colors disabled:opacity-60">
                {createBusy ? <Icon name="loader" className="w-3.5 h-3.5 animate-spin" /> : 'Ustvari tablo'}
              </button>
              <button onClick={() => { setShowCreate(false); setCreateErr(''); }} className="text-sm text-slate-500 px-3 py-1.5 hover:text-slate-800 transition-colors">Prekliči</button>
            </div>
          </div>
        </div>
      )}

      {/* sign-up modal */}
      {signupModalDate && (
        <div className="fixed inset-0 bg-slate-900/40 flex items-center justify-center p-4 z-50">
          <div className="bg-white border border-slate-300 rounded-sm p-5 w-full max-w-sm">
            <h3 className="font-display font-semibold text-lg text-slate-900 mb-1">{formatDateLabel(signupModalDate.date)}</h3>
            {signupModalDate.note && <p className="text-sm text-slate-500 mb-3">{signupModalDate.note}</p>}
            {signupModalLocked ? (
              <div>
                <div className="flex items-center gap-2 text-red-700 bg-red-50 border border-red-200 rounded-sm px-3 py-2 mb-4">
                  <Icon name="lock" className="w-4 h-4 shrink-0" />
                  <span className="text-sm">Ta datum je žal zaseden ({(signupModalDate.signups || []).length}/{signupModalDate.maxCapacity}).</span>
                </div>
                <button onClick={closeSignupModal} className="text-sm text-slate-500 px-3 py-1.5 hover:text-slate-800 transition-colors">Zapri</button>
              </div>
            ) : (
              <div>
                <label className="text-xs text-slate-500 block mb-3">Vnesite svoje ime
                  <input type="text" value={signupModalName} onChange={(e) => setSignupModalName(e.target.value)}
                    onKeyDown={(e) => e.key === 'Enter' && confirmSignup()}
                    className="mt-1 w-full border border-slate-300 rounded-sm px-3 py-1.5 text-sm focus:outline-none focus:ring-2 focus:ring-amber-500"
                    placeholder="Vaše ime" autoFocus />
                </label>
                {signupModalErr && <p className="text-xs text-red-700 mb-2">{signupModalErr}</p>}
                <div className="flex gap-2">
                  <button onClick={confirmSignup} disabled={signupModalBusy}
                    className="inline-flex items-center gap-1 bg-slate-800 text-white text-sm font-medium px-3.5 py-1.5 rounded-sm hover:bg-slate-700 transition-colors disabled:opacity-60">
                    {signupModalBusy ? <Icon name="loader" className="w-3.5 h-3.5 animate-spin" /> : 'Prijavi se'}
                  </button>
                  <button onClick={closeSignupModal} className="text-sm text-slate-500 px-3 py-1.5 hover:text-slate-800 transition-colors">Prekliči</button>
                </div>
              </div>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
</body>
</html>
